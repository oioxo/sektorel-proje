<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h2>DEPO<span>CONTROL</span></h2>
      <p>Sisteme erişmek için giriş yönteminizi seçin.</p>
    </div>

    <div class="login-sections">
      <div class="login-section admin-section">
        <div class="section-label">Yönetici</div>
        <p class="section-desc">Tüm depo ve kullanıcı yönetimine tam erişim</p>
        <button type="button" class="login-btn" (click)="yoneticiGiris()">🔐 Yönetici Olarak Gir</button>
      </div>

      <div class="section-divider">
        <span>veya</span>
      </div>

      <div class="login-section operator-section">
        <div class="section-label">Operatör</div>
        <p class="section-desc">Kendi depolarınızı görüntüleyin ve takip edin</p>
        <div class="input-group">
          <label>Adınızı Girin</label>
          <input type="text" [(ngModel)]="operatorAdi" placeholder="Örn: Ahmet Yılmaz" class="name-input"
                 (keyup.enter)="operatorGiris()">
        </div>
        <div *ngIf="hata" class="error-msg">{{ hata }}</div>
        <button type="button" class="user-btn" (click)="operatorGiris()">👤 Operatör Olarak Gir</button>
      </div>
    </div>
  </div>
</div>
