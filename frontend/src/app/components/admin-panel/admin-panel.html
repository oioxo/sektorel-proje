<div class="admin-container">
  <section class="admin-section">
    <div class="section-header">
      <h2>⚙️ Sistem Kuralları ve Limit Yönetimi</h2>
      <p>Tüm depolar için geçerli olacak global sıcaklık kısıtlamalarını buradan güncelleyebilirsiniz.</p>
    </div>

    <div class="rules-card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Ürün Kategorisi</th>
            <th>Min. Sıcaklık (°C)</th>
            <th>Max. Sıcaklık (°C)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let urun of urunKategorileri">
            <td class="category-name"><strong>{{ urun.ad }}</strong></td>
            <td>
              <div class="input-wrapper">
                <input type="number" [(ngModel)]="urun.min" class="limit-input" placeholder="Min">
                <span class="unit">°C</span>
              </div>
            </td>
            <td>
              <div class="input-wrapper">
                <input type="number" [(ngModel)]="urun.max" class="limit-input" placeholder="Max">
                <span class="unit">°C</span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="action-footer">
        <button class="save-rules-btn" (click)="limitleriGuncelle()">
          <span class="btn-icon">💾</span> Kısıtlamaları Kaydet
        </button>
      </div>
    </div>
  </section>
</div>
