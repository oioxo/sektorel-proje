server:
  port: 8044 # (Localhost:8044'ten bağlanacak)

spring:
  jpa:
    hibernate:
      ddl-auto: update # Tabloları otomatik oluşturur/günceller
    show-sql: true # Konsolda SQL sorgularını görmek için
  
  servlet:
    multipart:
      max-file-size: 10MB # Yüklenecek maksimum dosya boyutu
      max-request-size: 10MB

  # Database Configuration
  datasource:
    url: jdbc:***************
    username: p*****
    password: ***************
    driver-class-name: org.postgresql.Driver
    
  mail:
    host: smtp.gmail.com
    port: *****
    username: *****************
    password: *****************
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true